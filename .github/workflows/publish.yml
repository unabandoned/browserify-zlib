name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@ae2bd5a86503774166346992cf1a5eeef28117bc # main
    with:
      install-for-publish: false
    secrets: inherit
