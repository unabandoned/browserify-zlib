name: Renovate Config

# Validate this fork's renovate.json against Renovate's schema so a
# malformed config can't silently halt Renovate on a bot- or
# Claude-authored PR. Delegates to the shared reusable workflow.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  renovate-config:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-renovate-config.yml@ae2bd5a86503774166346992cf1a5eeef28117bc # main
